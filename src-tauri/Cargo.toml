[package]
name = "doccraft"
version = "0.1.0"
description = "DocCraft - offline-first desktop document utility"
authors = ["DocCraft contributors"]
license = "MIT"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "doccraft_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lopdf = { version = "0.45", default-features = false }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
tempfile = "3"
flate2 = "1"
regex = "1"
getrandom = "0.3"
cms = { version = "0.2.3", features = ["builder"] }
x509-cert = { version = "0.2.5", features = ["builder"] }
der = { version = "0.7", features = ["alloc", "oid"] }
spki = "0.7"
rsa = { version = "0.9", features = ["sha2"] }
p256 = { version = "0.13", features = ["ecdsa", "pkcs8"] }
p384 = { version = "0.13", features = ["ecdsa", "pkcs8"] }
signature = "2"
const-oid = { version = "0.9", features = ["db"] }
p12-keystore = "0.4"
sha2 = "0.10"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
ab_glyph = "0.2"
rand = "0.8"
